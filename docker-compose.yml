services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./Rent-a-local/apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES}
      GMAIL_MAIL: ${GMAIL_MAIL}
      GMAIL_PASS: ${GMAIL_PASS}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/locals || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  seed:
    image: postgres:16-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./init:/init
    entrypoint: >
      sh -c "
        echo 'Running seed...' &&
        psql -h db -U ${DB_USERNAME} -d ${DB_DATABASE} -f /init/01-users.sql &&
        psql -h db -U ${DB_USERNAME} -d ${DB_DATABASE} -f /init/02-locals.sql &&
        echo 'Seed complete!'
      "
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: ./Rent-a-local-frontend/apps/frontend/Dockerfile
      args:
        REACT_APP_BASE_URL: /v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: